<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChemiQuiz: Recopilació</title>
    <link rel="stylesheet" href="style.css" />
    <script src="jquery-3.7.1.min.js"></script>
    <!-- Font Poppins per a una estètica moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <h1>ChemiQuiz: Recopilació</h1>

    <section id="formulari">
      <form id="configuracioJoc">
        <p>En aquest mode podràs desafiar tot allò que has après anteriorment.</p>
        <br />

        <label>
          Dificultat:
          <select id="dificultat">
            <option value="facil">Fàcil (10 preguntes)</option>
            <option value="mitja">Mitjà (15 preguntes)</option>
            <option value="dificil">Difícil (20 preguntes)</option>
          </select> </label
        ><br /><br />
        <label>
          Tipus d'elements:
          <select id="importancia">
            <option value="1">Importants</option>
            <option value="0">Importants + No tant importants</option>
          </select> </label
        ><br /><br />
        <label>
            Modalitat de joc:
            <select id="modalitat">
                <option value="flash">Flash (Temps curt per pregunta)</option>
                <option value="mix">Mix (Temps moderat per pregunta)</option>
                <option value="extension">Extension (Temps llarg per pregunta)</option>
            </select>
        </label><br /><br />

        <button type="submit">Començar joc</button>
        <br /><br /><br />
        <a href="../jocs" style="text-decoration: none;" class="element-tornar">TORNAR A JOCS</a>
      </form>
    </section>

    <section id="joc" style="display: none">
      <!-- Cronòmetre global de partida o progressió -->
      <div id="crono"></div>
      <div id="zonaDrop" class="zona-general-drop"></div>
      <div id="zonaElements" class="zona-general-elements"></div>
      <button onclick="tornarEnrereEnJoc()" class="element-tornar">
        Tornar al Menú
      </button>
    </section>

    <section id="seccioPregunta" style="display: none">
      <!-- Cronòmetre per pregunta, només visible aquí -->
      <div id="cronoPregunta"></div>
      <br>
      <br>
      <p id="textPregunta"></p>
      <!-- Aquest div s'utilitzarà per opcions de resposta o input de text -->
      <div id="opcionsRespostes"></div>
      <button id="botoSeguentPregunta" class="boto-joc" style="display: none;">Següent Pregunta</button>
      <button onclick="tornarEnrereEnJoc()" class="element-tornar">
        Tornar al Menú
      </button>
    </section>

    <section id="resultat" style="display: none">
      <h2>Resultat Final</h2>
      <p id="missatgeFinal"></p>
      <button onclick="reiniciarJoc()" class="element-tornar">Tornar al Menú</button>
    </section>

    <script src="script.js"></script>
  </body>
</html>
